name: apk feed

# Release pipeline (issue #63 gate): build the package (apk/build.sh), run
# the container test matrix (the SAME tests/*.sh scripts the dev stand runs
# via scripts/dev-test.sh), and only publish the feed to the orphan `feed`
# branch (served via raw.githubusercontent.com) when every matrix job is
# green. A red matrix = the release is not published. The live-feed install
# (feed-test) runs right after publishing as the final canary.
#
# Release flow: tag v1.0.6 -> package version 1.0.6-r1. The major version
# tracks the pinned upstream zapret2 release (scripts/fetch-upstream.sh);
# a guard in build fails the run if they diverge. Publishing happens for
# tag pushes only - manual dispatch runs validate the matrix without
# touching the live feed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_STATIC_URL: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v3.0.7/x86_64/apk.static
  APK_STATIC_SHA256: c07bf5356eacc9dd7a8c56bc537f46702f007170287403299d52a04264e74b3c

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            base="${GITHUB_REF_NAME#v}"
            case "$base" in
              *-r[0-9]*) echo "ver=$base" >> "$GITHUB_OUTPUT" ;; # explicit revision tag: v1.0.6-r2
              *) echo "ver=$base-r1" >> "$GITHUB_OUTPUT" ;;      # vX.Y.Z -> X.Y.Z-r1
            esac
          else
            echo "ver=0.0.0-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pinned apk.static 3.0.7
        run: |
          curl -fsSL --retry 3 --connect-timeout 20 -o apk.static "$APK_STATIC_URL" \
            || curl -fsSL --retry 3 --connect-timeout 20 -o apk.static \
              "https://github.com/sers88/wanguard/releases/download/ci-tools/apk.static"
          echo "$APK_STATIC_SHA256  apk.static" | sha256sum -c - # pin gates EITHER source
          chmod +x apk.static

      - name: Guard - release tag must match the pinned upstream engine version
        if: github.ref_type == 'tag'
        run: |
          set -eu
          pinned=$(grep -m1 '^ZAPRET2_VERSION_DEFAULT=' scripts/fetch-upstream.sh | cut -d= -f2)
          base="${GITHUB_REF_NAME#v}"; base="${base%%-r*}"
          echo "tag base=$base pinned=$pinned"
          [ "$base" = "$pinned" ] || {
            echo "ERROR: release tag v<pkg>[-rN] must carry the pinned zapret2 version in scripts/fetch-upstream.sh (package major version = upstream version)" >&2
            exit 1
          }

      - name: Fetch pinned upstream engine payload (nfqws2 + lua)
        run: sh scripts/fetch-upstream.sh

      - name: Build package
        run: |
          sh apk/build.sh "$GITHUB_WORKSPACE" ./apk.static "${{ steps.ver.outputs.ver }}" out
          ls -la out

      - name: Guard - one tag, both packages (issue #78)
        run: |
          set -eu
          for p in wanguard-antidpi luci-app-wanguard-antidpi; do
            f="out/$p-${{ steps.ver.outputs.ver }}.apk"
            [ -f "$f" ] || { echo "ERROR: $f missing - one tag must ship both packages" >&2; exit 1; }
          done

      - name: Inspect package metadata
        run: |
          for p in out/*.apk; do
            echo "== $p"
            ./apk.static adbdump "$p" | sed -n '/^info:/,/^paths:/p'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*.apk

  # ---- test matrix (issue #63): the same tests/*.sh scripts the local dev
  # ---- stand runs; all four must be green before anything is published
  smoke-test:
    name: Matrix - install + smoke (layout, conffile, DRYRUN)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Install + smoke matrix in OpenWrt container (same script as the dev stand)
        env:
          VER: ${{ needs.build.outputs.ver }}
        run: |
          docker run --rm \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/container-smoke.sh local "$VER"

  mark-test:
    name: Matrix - mihomo mark integration (real mihomo, NET_ADMIN)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Mark integration test in OpenWrt container (pinned real mihomo)
        run: |
          docker run --rm --cap-add NET_ADMIN \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/test-mark.sh

  nft-test:
    name: Matrix - final nft table live (OpenWrt container, NET_ADMIN)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Final table live matrix in OpenWrt container (pinned real mihomo)
        run: |
          docker run --rm --cap-add NET_ADMIN \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/test-nft.sh

  tunnel-test:
    name: Matrix - tunnel exclusion updater (OpenWrt container, NET_ADMIN)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Resolver updater live matrix in OpenWrt container (stub DNS)
        run: |
          docker run --rm --cap-add NET_ADMIN \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/test-tunnel.sh

  status-test:
    name: Matrix - status surface (OpenWrt container, NET_ADMIN)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Status surface matrix in OpenWrt container (live engine when allowed)
        run: |
          docker run --rm --cap-add NET_ADMIN \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/test-status.sh

  apply-test:
    name: Matrix - apply orchestration (OpenWrt container, NET_ADMIN)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Apply orchestration matrix in OpenWrt container (stub init + stub DNS)
        run: |
          docker run --rm --cap-add NET_ADMIN \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/test-apply.sh

  profiles-test:
    name: Matrix - strategy profiles (OpenWrt container, NET_ADMIN)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Strategy profiles matrix in OpenWrt container (live part probes NFQUEUE)
        run: |
          docker run --rm --cap-add NET_ADMIN \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/test-profiles.sh

  luci-test:
    name: Matrix - luci menu + ACL (OpenWrt container)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: LuCI menu + ACL matrix in OpenWrt container (luci-base from the image feed)
        env:
          VER: ${{ needs.build.outputs.ver }}
        run: |
          docker run --rm \
            -v "$PWD/out:/out:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/test-luci.sh "$VER"

  # ---- publication gate: reached only when the whole matrix is green.
  # ---- Tag pushes only - dispatch runs validate without publishing.
  publish:
    name: Sign index, publish feed branch (gated by the matrix)
    needs: [build, smoke-test, mark-test, nft-test, tunnel-test, status-test, apply-test, profiles-test, luci-test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Download pinned apk.static 3.0.7
        run: |
          curl -fsSL --retry 3 --connect-timeout 20 -o apk.static "$APK_STATIC_URL" \
            || curl -fsSL --retry 3 --connect-timeout 20 -o apk.static \
              "https://github.com/sers88/wanguard/releases/download/ci-tools/apk.static"
          echo "$APK_STATIC_SHA256  apk.static" | sha256sum -c - # pin gates EITHER source
          chmod +x apk.static

      - name: Verify signing key against committed public key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          set -eu
          [ -n "$APK_SIGN_KEY" ] || { echo "APK_SIGN_KEY secret is not set" >&2; exit 1; }
          printf '%s\n' "$APK_SIGN_KEY" > private-key.pem
          openssl ec -in private-key.pem -pubout -out derived.pem
          diff -u keys/wanguard-antidpi.pem derived.pem

      - name: Sign repository index
        run: |
          ./apk.static mkndx --allow-untrusted --sign private-key.pem --output out/packages.adb out/*.apk
          rm -f private-key.pem
          ls -la out

      - name: Publish feed branch
        env:
          VER: ${{ needs.build.outputs.ver }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/packages/x86_64 site/keys
          cp out/*.apk out/packages.adb site/packages/x86_64/
          cp keys/wanguard-antidpi.pem site/keys/wanguard-antidpi.pem
          cd site
          git init -q -b feed
          git config user.name "wanguard-antidpi-feed-bot"
          git config user.email "wanguard-antidpi-feed-bot@users.noreply.github.com"
          git add -A
          git commit -qm "feed $VER ($GITHUB_REF_NAME)"
          git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" feed:feed

  # ---- post-publish canary: install from the live feed. Cannot precede
  # ---- publication by definition; the matrix already install-tested the
  # ---- SAME artifact (smoke-test, local mode) before it was published.
  feed-test:
    name: Live feed install canary (OpenWrt container)
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install + smoke test from the live feed (same script as the dev stand)
        env:
          VER: ${{ needs.build.outputs.ver }}
        run: |
          docker run --rm \
            -v "$PWD/keys:/hostkeys:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/tests:/tests:ro" \
            openwrt/rootfs:x86_64-25.12.6 \
            sh /tests/container-smoke.sh feed "$VER"
